                    </div>
                    <div className="hidden sm:block cursor-pointer hover:opacity-80 transition-opacity" onClick={() => setActiveWeek('main')}>
                        <h1 className={`text-2xl font-serif font-bold tracking-tight ${isDarkMode ? 'text-slate-100' : 'text-slate-800'}`}>Bilingualism Guide</h1>
                        <p className="text-xs font-bold text-slate-500 uppercase tracking-widest mt-0.5">Interactive Master Note</p>
                    </div>
                    <h1 className={`sm:hidden text-xl font-serif font-bold ${isDarkMode ? 'text-slate-100' : 'text-slate-800'} cursor-pointer`} onClick={() => setActiveWeek('main')}>Bilingualism</h1>
                  </div>

                  <div className="flex items-center gap-3">
                    
                    {/* Dark Mode Toggle */}
                    <button 
                        onClick={toggleDarkMode}
                        className={`p-2 rounded-md border transition-all shadow-sm ${isDarkMode ? 'bg-slate-800 border-slate-700 text-yellow-400' : 'bg-white border-slate-200 text-slate-400 hover:text-slate-600'}`}
                    >
                        {isDarkMode ? <Sun className="w-5 h-5" /> : <Moon className="w-5 h-5" />}
                    </button>

                    <div className={`hidden sm:flex items-center border rounded-md p-1 shadow-sm ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                      <button onClick={() => setFontSize('text-base')} className={`p-2 rounded-sm transition-all ${fontSize === 'text-base' ? (isDarkMode ? 'bg-slate-700 text-slate-100' : 'bg-slate-100 text-slate-900 font-bold') : 'text-slate-400 hover:text-slate-600'}`}><Type className="w-4 h-4" /></button>
                      <button onClick={() => setFontSize('text-lg')} className={`p-2 rounded-sm transition-all ${fontSize === 'text-lg' ? (isDarkMode ? 'bg-slate-700 text-slate-100' : 'bg-slate-100 text-slate-900 font-bold') : 'text-slate-400 hover:text-slate-600'}`}><Type className="w-5 h-5" /></button>
                      <button onClick={() => setFontSize('text-xl')} className={`p-2 rounded-sm transition-all ${fontSize === 'text-xl' ? (isDarkMode ? 'bg-slate-700 text-slate-100' : 'bg-slate-100 text-slate-900 font-bold') : 'text-slate-400 hover:text-slate-600'}`}><Type className="w-6 h-6" /></button>
                    </div>

                    {/* UPDATED: Changed from sm:hidden to lg:hidden so it shows on tablets too */}
                    <button className={`lg:hidden p-2 rounded-md hover:bg-opacity-80 border ${isDarkMode ? 'text-slate-300 border-slate-700 bg-slate-800' : 'text-slate-600 hover:bg-slate-100 border-slate-200'}`} onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>
                      {mobileMenuOpen ? <X className="w-6 h-6" /> : <Menu className="w-6 h-6" />}
                    </button>
                  </div>
                </div>
              </header>

              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col lg:flex-row gap-8">
                
                {/* Sidebar */}
                <nav className={`
                  lg:w-72 flex-shrink-0 lg:block
                  ${mobileMenuOpen ? `block fixed inset-0 z-50 p-6 ${sidebarBg}` : 'hidden'}
                  lg:static lg:bg-transparent lg:p-0
                `}>
                  {mobileMenuOpen && (
                      <div className="flex justify-end mb-4 lg:hidden">
                          <button onClick={() => setMobileMenuOpen(false)} className={`p-2 border rounded-full shadow-sm ${isDarkMode ? 'bg-slate-800 border-slate-700 text-slate-300' : 'bg-white border-slate-200 text-slate-600'}`}>
                              <X className="w-6 h-6"/>
                          </button>
                      </div>
                  )}

                  <div className="lg:sticky lg:top-28 space-y-3">
                    <h2 className={`text-xs font-bold uppercase tracking-widest mb-4 px-2 hidden lg:block border-b pb-2 ${isDarkMode ? 'text-slate-500 border-slate-700' : 'text-slate-400 border-slate-200'}`}>Study Modules</h2>
                    {studyData.map((data) => {
                        const isActive = activeWeek === data.week;
                        const itemTheme = getTheme(data.colorKey, isDarkMode);
                        
                        return (
                          <button
                            key={data.week}
                            onClick={() => {
                              setActiveWeek(data.week);
                              setMobileMenuOpen(false);
                            }}
                            className={`
                              w-full flex items-center gap-4 px-4 py-4 text-sm font-medium rounded-md transition-all duration-300 group border
                              ${isActive 
                                ? `shadow-md ${itemTheme.lightBg} ${itemTheme.border} ${itemTheme.accent}` 
                                : `bg-transparent border-transparent text-slate-500 hover:shadow-sm ${isDarkMode ? 'hover:bg-slate-800 hover:border-slate-700 hover:text-slate-300' : 'hover:bg-white hover:border-slate-200 hover:text-slate-700'}`}
                            `}
                          >
                            <div className={`
                                p-2 rounded-md transition-colors duration-300 border
                                ${isActive ? `${itemTheme.iconBg} ${isDarkMode ? 'border-slate-600' : 'border-slate-200'}` : `bg-transparent border-transparent ${isDarkMode ? 'group-hover:bg-slate-800 group-hover:border-slate-700' : 'group-hover:bg-slate-50 group-hover:border-slate-100'}`}
                            `}>
                                {data.icon}
                            </div>
                            <div className="text-left">
                                <span className={`block text-xs font-bold uppercase tracking-wider mb-0.5 ${isActive ? itemTheme.primary : 'text-slate-500'}`}>
                                    {typeof data.week === 'number' ? `Week ${data.week}` : data.week}
                                </span>
                                <span className={`block font-serif text-lg ${isActive ? (isDarkMode ? 'text-slate-100' : 'text-slate-900') + ' font-bold' : 'text-slate-500'}`}>
                                    {data.title.replace(/^Week \d+: /, '')}
                                </span>
                            </div>
                          </button>
                        );
                    })}
                  </div>
                </nav>

                {/* Main Content */}
                <main className="flex-1 min-w-0">
                  {isMainPage ? (
                      <MainPage studyData={studyData} setActiveWeek={setActiveWeek} isDarkMode={isDarkMode} />
                  ) : (
                    <>
                      <div className={`relative overflow-hidden p-8 rounded-md shadow-lg mb-8 bg-gradient-to-br ${theme.gradient} text-white border border-white/10`}>
                        <div className="relative z-10">
                            <span className="inline-block px-3 py-1 rounded-sm bg-white/10 backdrop-blur-sm text-xs font-bold uppercase tracking-widest mb-4 border border-white/20">
                                Current Module
                            </span>
                            <h2 className="text-3xl sm:text-4xl font-serif font-bold mb-3 leading-tight">{currentData.fullTitle}</h2>
                            <div className="flex items-center gap-2 text-white/80 text-sm font-medium mt-6 pt-6 border-t border-white/10">
                                 <span>{currentData.sections.length} Key Topics</span>
                                 <span className="mx-2 text-white/40">•</span>
                                 <span>{currentData.quiz.length} Practice MCQs</span>
                            </div>
                        </div>
                      </div>

                      <div className="space-y-6">
                        {currentData.sections.map((section, index) => {
                          const isOpen = openSections[activeWeek]?.[index] ?? false;

                          if (section.type === 'checklist') {
                            return (
                              <ChecklistSection 
                                key={index} 
                                section={section} 
                                fontSizeClass={getFontSizeClass()} 
                                isOpen={isOpen}
                                toggle={() => toggleSection(activeWeek, index)}
                                theme={theme}
                                isDarkMode={isDarkMode}
                              />
                            );
                          }
                          
                          if (section.type === 'glossary') {
                              return (
                                  <GlossarySection 
                                      key={index}
                                      items={section.items}
                                      theme={theme}
                                      isDarkMode={isDarkMode}
                                  />
                              );
                          }
                          
                          return (
                            <CollapsibleSection 
                              key={index} 
                              section={section} 
                              fontSizeClass={getFontSizeClass()} 
                              isOpen={isOpen}
                              toggle={() => toggleSection(activeWeek, index)}
                              theme={theme}
                              isDarkMode={isDarkMode}
                            />
                          );
                        })}
                        
                        {/* Quiz Section rendered at the bottom of the week */}
                        <QuizSection 
                            quizData={currentData.quiz} 
                            theme={theme} 
                            isDarkMode={isDarkMode} 
                        />

                        {/* Navigation Footer */}
                        <div className={`flex flex-col sm:flex-row justify-between items-center gap-4 mt-12 pt-8 border-t ${isDarkMode ? 'border-slate-700' : 'border-slate-200'}`}>
                            {prevModule ? (
                                <button 
                                    onClick={() => setActiveWeek(prevModule.week)}
                                    className={`flex items-center gap-2 px-4 py-2 rounded-md font-bold transition-all ${isDarkMode ? 'text-slate-400 hover:text-slate-200 hover:bg-slate-800' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-100'}`}
                                >
                                    <ChevronRight className="w-5 h-5 rotate-180" />
                                    <div className="text-left">
                                        <span className="text-xs uppercase tracking-wider block opacity-70">Previous</span>
                                        <span>{prevModule.title}</span>
                                    </div>
                                </button>
                            ) : <div></div>}

                            {nextModule ? (
                                <button 
                                    onClick={() => setActiveWeek(nextModule.week)}
                                    className={`flex items-center gap-2 px-6 py-3 rounded-md font-bold text-white shadow-md transition-transform hover:scale-105 ${theme.highlight}`}
                                >
                                    <div className="text-right">
                                        <span className="text-xs uppercase tracking-wider block opacity-90">Next Module</span>
                                        <span>{nextModule.title}</span>
                                    </div>
                                    <ChevronRight className="w-5 h-5" />
                                </button>
                            ) : <div></div>}
                        </div>

                      </div>
                    </>
                  )}
                  
                  {/* Footer area */}
                  <div className={`mt-12 text-center text-sm pb-8 font-serif italic border-t pt-8 ${isDarkMode ? 'text-slate-500 border-slate-700' : 'text-slate-400 border-slate-200'}`}>
                      <p>Designed for focused study • Good luck on your exam!</p>
                  </div>
                </main>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BilingualismStudyApp />);
    </script>
</body>
</html>
